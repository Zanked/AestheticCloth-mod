name: Build mod jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the mod archive
        run: |
          set -e
          test -f fitting-room-mod.zip || { echo "fitting-room-mod.zip not found"; exit 1; }
          rm -rf src docs
          unzip -q -o fitting-room-mod.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the jar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fitting-room-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish the jar as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fitting Room build ${{ github.run_number }}
          body: Put the .jar into the mods folder (NeoForge 1.21.1).
          files: build/libs/*.jar
          make_latest: true
