name: Build mod jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history is needed to find the most recently uploaded archive

      - name: Unpack the mod archive (any name)
        run: |
          set -e
          # every .zip in the repository, except what the build itself creates
          mapfile -t ZIPS < <(git ls-files '*.zip')
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "No .zip archive found in the repository"; exit 1
          fi
          # take the archive that was changed last (the newest upload wins)
          BEST=""; BEST_TIME=0
          for z in "${ZIPS[@]}"; do
            t=$(git log -1 --format=%ct -- "$z")
            if [ "$t" -ge "$BEST_TIME" ]; then BEST="$z"; BEST_TIME="$t"; fi
          done
          echo "Using archive: $BEST"

          rm -rf "$RUNNER_TEMP/unpacked"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q -o "$BEST" -d "$RUNNER_TEMP/unpacked"

          # the project may be at the top of the archive or inside one folder
          ROOT="$RUNNER_TEMP/unpacked"
          if [ ! -f "$ROOT/build.gradle" ]; then
            FOUND=$(find "$ROOT" -maxdepth 3 -name build.gradle -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$FOUND" ]; then echo "build.gradle not found in $BEST"; exit 1; fi
            ROOT=$(dirname "$FOUND")
          fi

          # replace the old sources with the ones from the archive
          rm -rf src docs libs tools build.gradle gradle.properties settings.gradle
          cp -a "$ROOT"/. .
          rm -rf "$RUNNER_TEMP/unpacked"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the jar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fitting-room-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish the jar as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fitting Room build ${{ github.run_number }}
          body: Put the .jar into the mods folder (NeoForge 1.21.1).
          files: build/libs/*.jar
          make_latest: true
